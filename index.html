<style>
*{box-sizing:border-box}
body{min-height:100svh;margin:0;display:grid;place-items:center;padding:28px 16px;background:radial-gradient(ellipse at 20% 10%,#fffaf9 0,transparent 60%),#f5e6e8;color:#50253a;font:16px/1.65 "DM Sans","PingFang SC","Microsoft YaHei",sans-serif}
main{width:min(480px,100%);padding:clamp(22px,7vw,42px);background:#fffafb;border:1px solid #eedee2;border-radius:24px;box-shadow:0 18px 52px #75435113}
h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(27px,7.5vw,39px);margin:12px 0 0;line-height:1.2;font-weight:500;letter-spacing:-.022em}
header{text-align:center;margin-bottom:26px}header p{margin:10px 0;color:#78475c}.cat-stage{position:relative;width:clamp(170px,42vw,210px);margin:0 auto -6px}.cat-stage .mascot{width:100%;margin:0}.bubble{position:absolute;right:-86px;top:4px;background:#fff7fb;border:2px solid #efabc5;border-radius:18px;padding:8px 12px;color:#c45c86;font-weight:700;font-size:12px;white-space:nowrap;box-shadow:0 4px 12px #d47f9b33}.bubble:after{content:"";position:absolute;left:18px;bottom:-8px;border-width:8px 8px 0 0;border-style:solid;border-color:#efabc5 transparent transparent transparent}.blink{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}.blink:before,.blink:after{content:"";position:absolute;top:36%;width:10%;height:3px;background:#222;border-radius:4px;transform:scaleY(0);animation:blink 5s infinite}.blink:before{left:25%}.blink:after{right:25%}@keyframes blink{0%,92%,100%{transform:scaleY(0)}94%,97%{transform:scaleY(1)}}.heart{position:absolute;color:#ff77a8;font-size:17px;animation:heartFloat 3.4s ease-in-out infinite}.heart.one{right:-26px;top:64px}.heart.two{right:-42px;top:104px;font-size:13px;animation-delay:1.2s}.heart.three{left:-28px;top:88px;font-size:12px;animation-delay:2s}@keyframes heartFloat{50%{transform:translateY(-8px) scale(1.08)}}
.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}.snow i{position:absolute;top:-10px;color:#fff;font-style:normal;opacity:.6;animation:fall linear infinite;text-shadow:0 1px 5px #b67a8c66}.snow i:nth-child(1){left:12%;animation-duration:9s;font-size:14px}.snow i:nth-child(2){left:39%;animation-duration:12s;font-size:11px}.snow i:nth-child(3){left:67%;animation-duration:10s;font-size:15px}.snow i:nth-child(4){left:87%;animation-duration:13s;font-size:12px}@keyframes fall{to{transform:translateY(105vh) rotate(180deg)}}.mascot{display:block;width:clamp(108px,28vw,136px);height:auto;margin:0 auto -6px}
.icon{display:grid;place-items:center;width:64px;height:64px;margin:auto;border-radius:22px;background:#fbe1e9;font-size:32px}
label{display:block;font-weight:650;margin-bottom:6px}
textarea,input{width:100%;border:1px solid #ecc3d1;background:#fff4f7;color:inherit;border-radius:15px;padding:13px 14px;font:inherit}
textarea{min-height:140px;resize:vertical}::placeholder{color:#896475}
:focus-visible{outline:3px solid #a63b67;outline-offset:3px}
button{cursor:pointer;width:100%;border:0;border-radius:14px;background:#784554;color:white;padding:12px 18px;font:inherit;font-weight:700;margin-top:10px}
button:disabled{opacity:.65;cursor:wait}button:hover:enabled{background:#623643}
small{display:block;text-align:right;color:#78475c}
footer{text-align:center;margin-top:20px;font-size:14px}a{color:#853b59}
#status{margin:12px 0 0}#status:empty{display:none}
article{margin-top:12px;padding:12px 16px;background:#fff0f5;border-radius:14px;overflow-wrap:anywhere}article p{white-space:pre-wrap;margin:5px 0}
.notice{color:#78475c;font-size:13px;margin:8px 0}
#answers{border-top:1px solid #eedee2;margin-top:24px;padding-top:14px}
#answers h2{font-size:20px;margin:0 0 10px}
#answers article{background:#fff3f5}
.answer{border-top:1px solid #eedee2;padding-top:10px;margin-top:10px}
.reply-editor{margin-top:14px}
.reply-editor textarea{min-height:85px}
.reply-editor button{font-size:14px}time{font-size:13px;color:#78475c}
</style>

<h1>kakocooo的提问箱</h1><p>匿名提问箱</p></header>
<label for="message">你的问题</label>
<textarea id="message" placeholder="把想问的话写在这里…" maxlength="1000"></textarea><button id="submit">提交问题</button>
<p class="notice" id="status">匿名提交，不需要登录。</p>
<section class="owner"><button id="owner-login">箱主口令</button><div id="owner-box" hidden><input id="owner-key" type="password" placeholder="输入箱主口令"><button id="unlock-owner">查看提问</button><p id="owner-status"></p><div id="inbox"></div></div></section><section id="answers"><h2>公开问答</h2><p id="answers-state">正在加载公开问答…</p><div id="answer-list"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://vozddahzjddzrnkddwnx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RIvgclPSvO1S2rQWJqh7HQ_CrrVi0LP';
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const status = document.querySelector('#status');
const message = document.querySelector('#message');
const submit = document.querySelector('#submit');
const answerState = document.querySelector('#answers-state');
const answerList = document.querySelector('#answer-list');
async function loadAnswers() {
  const { data, error } = await client.from('questions').select('message,reply,created_at').not('reply','is',null).order('created_at',{ascending:false}).limit(30);
  if (error) { answerState.textContent = '公开问答暂时无法加载。'; return; }
  answerState.textContent = data.length ? '' : '这里会显示站主已发布的问答。';
  answerList.replaceChildren(...data.map(item => {
    const article = document.createElement('article');
    article.innerHTML = '<strong>匿名提问</strong>';
    const q = document.createElement('p'); q.textContent = item.message;
    const a = document.createElement('p'); a.className = 'answer'; a.textContent = '回复：' + item.reply;
    article.append(q,a); return article;
  }));
}
submit.addEventListener('click', async () => {
  const value = message.value.trim();
  if (!value) { status.textContent = '请先输入问题。'; return; }
  submit.disabled = true; status.textContent = '正在提交…';
  const { error } = await client.from('questions').insert({message:value,reply:null});
  submit.disabled = false;
  if (error) { status.textContent = '提交失败：' + (error.message || '请稍后再试。'); return; }
  message.value = ''; status.textContent = '问题已提交。';
});
const ownerLogin=document.querySelector('#owner-login'); const ownerBox=document.querySelector('#owner-box'); const ownerKey=document.querySelector('#owner-key'); const unlockOwner=document.querySelector('#unlock-owner'); const ownerStatus=document.querySelector('#owner-status'); const inbox=document.querySelector('#inbox');
ownerLogin.addEventListener('click',()=>{ownerBox.hidden=!ownerBox.hidden});
async function loadInbox(key){const ownerClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{global:{headers:{'x-owner-key':key}}}); ownerStatus.textContent='正在加载提问…'; const {data,error}=await ownerClient.from('questions').select('id,message,reply,created_at').order('created_at',{ascending:false}).limit(50); if(error){ownerStatus.textContent='口令错误或提问暂时无法加载。'; return} ownerStatus.textContent='已解锁箱主查看'; inbox.replaceChildren(...data.map(item=>{const a=document.createElement('article'); const q=document.createElement('div'); q.textContent='匿名提问：'+item.message; a.append(q); const r=document.createElement('textarea'); r.className='reply'; r.placeholder='填写回复'; r.value=item.reply||''; const b=document.createElement('button'); b.textContent='保存回复'; b.onclick=async()=>{b.disabled=true; const {error}=await ownerClient.from('questions').update({reply:r.value.trim()||null}).eq('id',item.id); b.disabled=false; ownerStatus.textContent=error?'保存失败。':'回复已保存。'; loadAnswers();}; a.append(r,b); return a}));}
unlockOwner.addEventListener('click',()=>{const key=ownerKey.value.trim(); if(key) loadInbox(key);});
loadAnswers();
</script></body></html>
